
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  js:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: ['20.19.0', '22', '24']
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: js
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: js/package-lock.json

      - run: npm ci
      - run: npm test

  ts:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ts
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - run: npm install
      - run: npx tsc --noEmit
      - run: npm test

  python:
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.13']
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: py
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -q

  cli-smoke-test:
    runs-on: ubuntu-latest
    needs: [js, ts, python]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      - name: Scaffold projects and verify optional flags
        shell: bash
        run: |
          set -e

          echo "Scaffolding JavaScript project..."
          node bin/create-forgecord.js scaffold-test-js --yes --lang=js --no-install --dashboard --database=sqlite

          test -f scaffold-test-js/bot.js
          test -f scaffold-test-js/.env
          test -f scaffold-test-js/dashboard/package.json

          node -e "const p = require('./scaffold-test-js/package.json'); if (!p.dependencies?.['good.db']) { console.error('good.db is missing from dependencies'); process.exit(1); }"

          echo "Installing JavaScript scaffold dependencies..."
          npm --prefix scaffold-test-js install

          echo "Running JavaScript scaffold tests..."
          npm --prefix scaffold-test-js test

          echo "Scaffolding TypeScript project..."
          node bin/create-forgecord.js scaffold-test-ts --yes --lang=ts --no-install --dashboard --database=json

          test -f scaffold-test-ts/bot.ts
          test -f scaffold-test-ts/.env
          test -f scaffold-test-ts/dashboard/package.json

          echo "Scaffolding Python project..."
          node bin/create-forgecord.js scaffold-test-py --yes --lang=py --no-install --database=json

          test -f scaffold-test-py/bot.py
          test -f scaffold-test-py/.env

          echo "All CLI smoke tests passed."
