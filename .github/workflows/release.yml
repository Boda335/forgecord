name: Release

# Publishes the `forgecord` CLI package to npm whenever a GitHub Release is
# published (Releases -> Draft a new release -> Publish release).
#
# Uses npm Trusted Publishing (OIDC): no NPM_TOKEN secret and no OTP needed.
#
# One-time setup on npmjs.com:
#   forgecord package -> Settings -> Trusted Publisher -> GitHub Actions
#     User/Organization : Boda335
#     Repository        : forgecord
#     Workflow filename : release.yml   (must match THIS file name exactly)
#     Environment       : (leave empty - this job does not use one)
#
# Before every release:
#   1. Bump "version" in package.json.
#   2. Create a release whose tag is "v<version>" (e.g. v1.2.5).

on:
  release:
    types: [published]

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # required for npm trusted publishing + provenance
    steps:
      - uses: actions/checkout@v4

      - name: Require successful CI for this commit
        uses: actions/github-script@v7
        with:
          script: |
            const { data: runs } = await github.rest.actions.listWorkflowRunsForRepo({ owner: context.repo.owner, repo: context.repo.repo, head_sha: context.sha, status: 'completed', per_page: 100 });
            const ci = runs.workflow_runs.find(run => run.name === 'CI' && run.conclusion === 'success');
            if (!ci) core.setFailed('A successful CI run for this release commit is required.');

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      # Trusted publishing needs npm 11.5.1 or newer.
      - name: Update npm
        run: |
          npm install -g npm@latest
          npm -v

      - run: npm install --omit=dev

      - name: Verify package.json version matches the release tag
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          PKG_VERSION="v$(node -p "require('./package.json').version")"
          if [ "$PKG_VERSION" != "$RELEASE_TAG" ]; then
            echo "package.json version ($PKG_VERSION) does not match the release tag ($RELEASE_TAG)."
            echo "Bump \"version\" in package.json to match before publishing."
            exit 1
          fi

      # No NODE_AUTH_TOKEN here: npm authenticates through GitHub's OIDC token.
      - run: npm publish --provenance --access public