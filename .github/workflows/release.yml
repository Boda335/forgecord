name: Release

# Publishes the root `forgecord` CLI package to npm whenever a GitHub
# Release is published (Releases → Draft a new release → publish).
#
# One-time setup required before this will work:
#   1. Create an npm access token (npmjs.com → Access Tokens → Generate New
#      Token → "Automation" type, so it bypasses 2FA prompts in CI).
#   2. Add it as a repository secret named NPM_TOKEN
#      (Settings → Secrets and variables → Actions → New repository secret).
#   3. Bump "version" in package.json before tagging a release — npm publish
#      refuses to re-publish an existing version.
#
# Until NPM_TOKEN is set, this workflow will simply fail at the publish step
# — it does not run on every push, so it's safe to leave in place.

on:
  release:
    types: [published]

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # enables npm provenance
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'

      - run: npm install --omit=dev

      - name: Verify package.json version matches the release tag
        run: |
          PKG_VERSION="v$(node -p "require('./package.json').version")"
          if [ "$PKG_VERSION" != "${{ github.event.release.tag_name }}" ]; then
            echo "package.json version ($PKG_VERSION) does not match the release tag (${{ github.event.release.tag_name }})."
            echo "Bump \"version\" in package.json to match before publishing."
            exit 1
          fi

      - run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
